apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak

spec:
  interval: 5m

  chartRef:
    kind: OCIRepository
    name: keycloak
    namespace: flux-system

  values:
    replicas: 1

    global:
      security:
        allowInsecureImages: true

    image:
      registry: docker.io
      repository: bitnamilegacy/keycloak
      tag: "26.3.3-debian-12-r0"

    auth:
      adminUser: admin
      adminPassword: YOUR_KEYCLOAK_ADMIN_PASSWORD

    externalDatabase:
      host: keycloak-db-rw.keycloak.svc.cluster.local
      port: 5432
      user: kcadmin
      password: YOUR_DB_PASSWORD
      database: keycloak

    postgresql:
      enabled: false

    service:
      type: ClusterIP


apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keycloak
  namespace: keycloak
spec:
  interval: 5m
  chart:
    spec:
      chart: keycloak
      version: 24.0.0
      sourceRef:
        kind: HelmRepository
        name: bitnami
        namespace: flux-system

  values:
    image:
      repository: quay.io/keycloak/keycloak
      tag: 26.0.0

    auth:
      adminUser: admin
      adminPassword: YOUR_KEYCLOAK_ADMIN_PASSWORD

    database:
      vendor: postgres
      host: keycloak-db-rw.keycloak.svc.cluster.local
      port: 5432
      username: kcadmin
      password: YOUR_DB_PASSWORD
      database: keycloak

    postgresql:
      enabled: false

    service:
      type: ClusterIP

    ingress:
      enabled: false

values:
  replicas: 1

  global:
    security:
      allowInsecureImages: true

  image:
    repository: quay.io/keycloak/keycloak
    tag: "26.3.0"

  auth:
    adminUser: admin
    adminPassword: YOUR_KEYCLOAK_ADMIN_PASSWORD

  externalDatabase:
    host: keycloak-db-rw.keycloak.svc.cluster.local
    port: 5432
    user: kcadmin
    password: YOUR_DB_PASSWORD
    database: keycloak

  postgresql:
    enabled: false

  service:
    type: ClusterIP
